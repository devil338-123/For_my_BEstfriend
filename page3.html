<!DOCTYPE html>
<html>
<head>
    <title>Page 3 💞</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>My Favorite Human 💖🌸</h1>

<!-- 🌸 Animated Bouquet -->
<div class="bouquet">

  <div class="flower f1"><div class="petals"></div><div class="center"></div></div>
  <div class="flower f2"><div class="petals"></div><div class="center"></div></div>
  <div class="flower f3"><div class="petals"></div><div class="center"></div></div>
  <div class="flower f4"><div class="petals"></div><div class="center"></div></div>
  <div class="flower f5"><div class="petals"></div><div class="center"></div></div>

  <div class="stem s1"></div>
  <div class="stem s2"></div>
  <div class="stem s3"></div>
  <div class="stem s4"></div>
  <div class="stem s5"></div>

  <div class="wrapper"></div>
</div>


<!-- 🐹 Animated Hamster -->
<div class="hamster-container">
    <div class="hamster-body">
        <div class="hamster-ear left"></div>
        <div class="hamster-ear right"></div>
        <div class="hamster-eye left"></div>
        <div class="hamster-eye right"></div>
        <div class="hamster-mouth"></div>
    </div>
</div>

<div class="message-card">
    Through the good days, the stressful days,
the random talks, the silly laughs…

You’ve been there.

And that’s something I’ll never take for granted.
Having you beside me makes life lighter, warmer, and happier.

I feel incredibly lucky that I get to call you
my best friend 💗
</div>

<a href="page4.html"><button>Final Page 💖</button></a>

<script>
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}
setInterval(createHeart, 600);
</script>

</body>
</html>
